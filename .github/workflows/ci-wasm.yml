# WebAssembly signing core and the TypeScript wrapper.
#
# Runs when the wasm build or the library core it compiles changes.
name: ci / wasm

on:
  # Advisory checks do not run on pull requests. Only the two jobs the
  # branch ruleset requires do, so a contributor sees two checks and not a
  # wall of them. These run when the change reaches main, and can be run
  # by hand from the Actions tab at any time.
  push:
    branches: [main]
    paths:
      - 'wasm/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    name: wasm signing core and typescript wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wasm/ts/package-lock.json
      # The core builds only for js/wasm, so `go build ./...` on the host skips
      # it. This job is the only place it is compiled, which is why the build is
      # a step of its own rather than folded into `go test`.
      - name: build the wasm module
        run: ./wasm/build.sh
      # A step of the existing job, not a job of its own: another job would be
      # another row, and the pull-request check count is capped at three. The
      # size is enforced right after the build that produced it, before the
      # slower parity and TypeScript steps, so a core that outgrew its ceiling
      # fails fast and says so by how much.
      - name: wasm size budget
        run: |
          go build -o bin/soroauth ./cmd/soroauth
          ./bin/soroauth wasm-budget --out wasm/dist/soroauth.wasm --json
      - name: wasm byte parity against the golden vectors
        run: node wasm/parity.mjs
      - name: typescript wrapper
        working-directory: wasm/ts
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: e2e wasm integration exercise
        run: |
          node -e "const fs = require('fs'); assert = require('assert'); assert(fs.existsSync('wasm/dist/soroauth.wasm'), 'wasm binary built');"
